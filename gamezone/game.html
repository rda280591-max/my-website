<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جزئیات بازی | گیم‌زون</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
<header class="site-header" id="siteHeader">
  <nav class="nav container">
    <a href="index.html" class="logo">🎮 گیم‌زون</a>
    <ul class="nav-menu" id="navMenu">
      <li><a href="index.html">خانه</a></li>
      <li><a href="games.html" class="active">بازی‌ها</a></li>
      <li><a href="reviews.html">نقدها</a></li>
      <li><a href="blog.html">بلاگ</a></li>
      <li><a href="about.html">درباره ما</a></li>
      <li><a href="contact.html">تماس</a></li>
    </ul>
    <div class="nav-actions">
      <button class="icon-btn theme-toggle" id="themeToggle">🌙</button>
      <a href="cart.html" class="icon-btn cart-btn">🛒 <span class="cart-count" id="cartCount">0</span></a>
      <a href="login.html" class="btn btn-sm">ورود</a>
      <button class="icon-btn menu-toggle" id="menuToggle">☰</button>
    </div>
  </nav>
</header>

<main class="container">
  <div class="breadcrumb"><a href="index.html">خانه</a> › <a href="games.html">بازی‌ها</a> › <span id="bcTitle">بازی</span></div>

  <article class="game-detail reveal" id="gameDetail">
    <div class="gd-hero" id="gdHero">
      <span class="gd-emoji" id="gdEmoji"></span>
      <div class="gd-badges">
        <span class="badge" id="gdGenre"></span>
        <span class="badge badge-year" id="gdYear"></span>
      </div>
    </div>
    <div class="gd-body">
      <h1 id="gdTitle"></h1>
      <div class="gd-rating"><span id="gdStars"></span> <span class="gd-score" id="gdScore"></span></div>
      <p class="gd-desc" id="gdDesc"></p>

      <div class="gd-meta">
        <div><b>سازنده:</b> <span id="gdDev"></span></div>
        <div><b>ناشر:</b> <span id="gdPub"></span></div>
        <div><b>پلتفرم‌ها:</b> <span id="gdPlats"></span></div>
        <div><b>تاریخ انتشار:</b> <span id="gdDate"></span></div>
      </div>

      <div class="gd-actions">
        <div class="gd-price">
          <span class="price-old" id="gdOld"></span>
          <span class="price-new" id="gdNew"></span>
        </div>
        <button class="btn btn-primary" id="addCartBtn">🛒 افزودن به سبد</button>
        <button class="btn btn-ghost" id="wishlistBtn">❤️ علاقه‌مندی</button>
      </div>
    </div>
  </article>

  <section class="tabs reveal">
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="about">درباره بازی</button>
      <button class="tab-btn" data-tab="specs">مشخصات فنی</button>
      <button class="tab-btn" data-tab="reviews">نظرات کاربران</button>
      <button class="tab-btn" data-tab="related">بازی‌های مشابه</button>
    </div>
    <div class="tab-pane active" id="tab-about"></div>
    <div class="tab-pane" id="tab-specs"></div>
    <div class="tab-pane" id="tab-reviews"></div>
    <div class="tab-pane" id="tab-related"></div>
  </section>
</main>

<footer class="footer">
  <div class="copyright">© ۱۴۰۵ گیم‌زون</div>
</footer>

<button id="toTop">↑</button>
<script src="js/main.js"></script>
</body>
</html>
